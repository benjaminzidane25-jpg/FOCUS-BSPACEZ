<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Space</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.8s ease, color 0.8s ease;
            position: relative;
        }

        /* =========================
           DAY THEME
        ========================== */

        body.day {
            background:
                linear-gradient(
                    180deg,
                    #68c9ff 0%,
                    #aee8ff 55%,
                    #e8faff 100%
                );
            color: #172033;
        }

        /* =========================
           NIGHT THEME
        ========================== */

        body.night {
            background:
                radial-gradient(
                    circle at top,
                    #172b55 0%,
                    #08152d 45%,
                    #030815 100%
                );
            color: white;
        }

        /* =========================
           SKY DECORATION
        ========================== */

        .sky {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* =========================
           CLOUDS - DAY
        ========================== */

        .cloud {
            position: absolute;
            width: 150px;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border-radius: 50px;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: cloudMove linear infinite;
        }

        body.day .cloud {
            opacity: 1;
        }

        body.night .cloud {
            opacity: 0;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud::before {
            width: 65px;
            height: 65px;
            left: 25px;
            top: -30px;
        }

        .cloud::after {
            width: 90px;
            height: 90px;
            right: 18px;
            top: -45px;
        }

        .cloud1 {
            top: 15%;
            left: -200px;
            animation-duration: 32s;
            transform: scale(0.8);
        }

        .cloud2 {
            top: 35%;
            left: -300px;
            animation-duration: 44s;
            animation-delay: -16s;
            transform: scale(1.15);
        }

        .cloud3 {
            top: 65%;
            left: -250px;
            animation-duration: 38s;
            animation-delay: -8s;
            transform: scale(0.65);
        }

        .cloud4 {
            top: 8%;
            left: -400px;
            animation-duration: 52s;
            animation-delay: -25s;
            transform: scale(0.5);
        }

        @keyframes cloudMove {
            from {
                left: -250px;
            }

            to {
                left: 110%;
            }
        }

        /* =========================
           STARS - NIGHT
        ========================== */

        .stars {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.night .stars {
            opacity: 1;
        }

        body.day .stars {
            opacity: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;

            box-shadow:
                0 0 4px white,
                0 0 8px rgba(255,255,255,0.6);

            animation: twinkle ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* =====================================================
           ⭐ WISH 5★
        ===================================================== */

      

        /* =========================
           TOP BAR
        ========================== */

        .top-bar {
            position: relative;
            z-index: 10;

            width: 100%;

            padding: 25px 40px;

            display: flex;
            justify-content: flex-end;
        }

        #themeButton {
            border: 1px solid rgba(255,255,255,0.25);

            padding: 12px 18px;

            border-radius: 30px;

            cursor: pointer;

            font-size: 16px;

            background: rgba(255,255,255,0.65);

            backdrop-filter: blur(15px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.1);

            transition: 0.3s;
        }

        body.night #themeButton {
            color: white;

            background:
                rgba(255,255,255,0.08);
        }

        #themeButton:hover {
            transform: translateY(-2px) scale(1.03);
        }

        /* =========================
           MAIN LAYOUT
        ========================== */

        .container {
            position: relative;
            z-index: 5;

            width: min(1100px, 90%);

            margin: 40px auto;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }

        .panel {
            padding: 30px;

            border-radius: 25px;

            backdrop-filter: blur(18px);

            background:
                rgba(255,255,255,0.25);

            border:
                1px solid rgba(255,255,255,0.4);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.12);

            transition:
                background 0.5s ease,
                border 0.5s ease,
                box-shadow 0.5s ease;
        }

        body.night .panel {
            background:
                rgba(8,17,40,0.5);

            border:
                1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* =========================
           TIMER
        ========================== */

        .timer-panel {
            text-align: center;
        }

        .timer {
            font-size: 90px;

            font-weight: bold;

            letter-spacing: 3px;

            margin: 50px 0 30px;

            text-shadow:
                0 8px 25px rgba(0,0,0,0.12);
        }

        .timer-buttons {
            display: flex;

            justify-content: center;

            gap: 12px;
        }

        .timer-buttons button {
            border: none;

            padding: 12px 22px;

            border-radius: 15px;

            cursor: pointer;

            font-size: 16px;

            background:
                rgba(255,255,255,0.72);

            transition: 0.2s;
        }

        body.night .timer-buttons button {
            background:
                rgba(255,255,255,0.12);

            color: white;
        }

        .timer-buttons button:hover {
            transform: translateY(-3px);
        }

        /* =========================
           TASKS
        ========================== */

        .task-input {
            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }

        .task-input input {
            flex: 1;

            padding: 14px;

            border-radius: 12px;

            border: none;

            outline: none;

            font-size: 15px;

            background:
                rgba(255,255,255,0.82);
        }

        body.night .task-input input {
            background:
                rgba(255,255,255,0.1);

            color: white;
        }

        body.night .task-input input::placeholder {
            color:
                rgba(255,255,255,0.5);
        }

        .task-input button {
            border: none;

            padding: 0 20px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 22px;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px;

            margin-bottom: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.4);

            backdrop-filter: blur(8px);
        }

        body.night .task {
            background:
                rgba(255,255,255,0.08);
        }

        .task-left {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .task-left input {
            width: 18px;
            height: 18px;

            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;

            opacity: 0.5;
        }

        .delete-btn {
            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 750px) {

            body {
                overflow-y: auto;
            }

            .container {
                grid-template-columns: 1fr;

                margin-top: 15px;
            }

            .timer {
                font-size: 60px;
            }

            .top-bar {
                padding: 20px;
            }

        }

    </style>
</head>


<body class="day">


    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="sky">

        <!-- DAY CLOUDS -->

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>


        <!-- NIGHT STARS -->

        <div class="stars" id="stars"></div>


        <!-- ⭐ WISH 5★ -->

        <div class="asteroid-container">

            <div class="asteroid-trail"></div>

            <div class="asteroid"></div>

        </div>

    </div>


    <!-- =========================
         THEME BUTTON
    ========================== -->

    <div class="top-bar">

        <button id="themeButton">
            🌙 Night Mode
        </button>

    </div>


    <!-- =========================
         MAIN APP
    ========================== -->

    <div class="container">


        <!-- TIMER -->

        <section class="panel timer-panel">

            <h2>⏱️ Focus Timer</h2>

            <div
                class="timer"
                id="timer"
            >
                25:00
            </div>

            <div class="timer-buttons">

                <button onclick="startTimer()">
                    ▶ Start
                </button>

                <button onclick="pauseTimer()">
                    ⏸ Pause
                </button>

                <button onclick="resetTimer()">
                    ↻ Reset
                </button>

            </div>

        </section>


        <!-- TASKS -->

        <section class="panel">

            <h2>📝 Add Task</h2>

            <div class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                >

                <button onclick="addTask()">
                    +
                </button>

            </div>

            <ul id="taskList"></ul>

        </section>


    </div>


    <script>

        /* =========================
           CREATE STARS
        ========================== */

        const starsContainer =
            document.getElementById("stars");


        for (let i = 0; i < 120; i++) {

            const star =
                document.createElement("div");

            star.classList.add("star");


            const size =
                Math.random() * 2.5 + 1;


            star.style.width =
                size + "px";

            star.style.height =
                size + "px";


            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";


            star.style.animationDuration =
                (Math.random() * 3 + 1.5) + "s";

            star.style.animationDelay =
                (Math.random() * 4) + "s";


            starsContainer.appendChild(star);

        }


        /* =========================
           THEME SYSTEM
        ========================== */

        const themeButton =
            document.getElementById("themeButton");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "night") {

            document.body.className = "night";

            themeButton.textContent =
                "☀️ Day Mode";

        }


        themeButton.addEventListener(
            "click",
            () => {

                if (
                    document.body.classList.contains("day")
                ) {

                    document.body.className =
                        "night";

                    themeButton.textContent =
                        "☀️ Day Mode";

                    localStorage.setItem(
                        "theme",
                        "night"
                    );

                }

                else {

                    document.body.className =
                        "day";

                    themeButton.textContent =
                        "🌙 Night Mode";

                    localStorage.setItem(
                        "theme",
                        "day"
                    );

                }

            }
        );


        /* =========================
           TIMER
        ========================== */

        let timeLeft =
            25 * 60;

        let timerInterval =
            null;


        const timerDisplay =
            document.getElementById("timer");


        function updateTimer() {

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;


            minutes =
                String(minutes)
                .padStart(2, "0");

            seconds =
                String(seconds)
                .padStart(2, "0");


            timerDisplay.textContent =
                `${minutes}:${seconds}`;

        }


        function startTimer() {

            if (
                timerInterval !== null
            ) return;


            timerInterval =
                setInterval(() => {

                    if (timeLeft > 0) {

                        timeLeft--;

                        updateTimer();

                    }

                    else {

                        clearInterval(
                            timerInterval
                        );

                        timerInterval = null;

                        alert(
                            "Focus session finished! 🎉"
                        );

                    }

                }, 1000);

        }


        function pauseTimer() {

            clearInterval(
                timerInterval
            );

            timerInterval = null;

        }


        function resetTimer() {

            clearInterval(
                timerInterval
            );

            timerInterval = null;

            timeLeft =
                25 * 60;

            updateTimer();

        }


        /* =========================
           TASK SYSTEM
        ========================== */

        const taskInput =
            document.getElementById("taskInput");

        const taskList =
            document.getElementById("taskList");


        let tasks =
            JSON.parse(
                localStorage.getItem("tasks")
            ) || [];


        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        function renderTasks() {

            taskList.innerHTML = "";


            tasks.forEach(
                (task, index) => {

                    const li =
                        document.createElement("li");

                    li.className =
                        "task";


                    li.innerHTML = `

                        <div class="task-left">

                            <input
                                type="checkbox"

                                ${task.completed
                                    ? "checked"
                                    : ""
                                }

                                onchange="
                                    toggleTask(${index})
                                "
                            >

                            <span
                                class="
                                    ${
                                        task.completed
                                        ? "completed"
                                        : ""
                                    }
                                "
                            >
                                ${task.text}
                            </span>

                        </div>


                        <button
                            class="delete-btn"

                            onclick="
                                deleteTask(${index})
                            "
                        >
                            🗑️
                        </button>

                    `;


                    taskList.appendChild(li);

                }
            );

        }


        function addTask() {

            const text =
                taskInput.value.trim();


            if (text === "")
                return;


            tasks.push({

                text: text,

                completed: false

            });


            taskInput.value = "";


            saveTasks();

            renderTasks();

        }


        function toggleTask(index) {

            tasks[index].completed =
                !tasks[index].completed;


            saveTasks();

            renderTasks();

        }


        function deleteTask(index) {

            tasks.splice(
                index,
                1
            );


            saveTasks();

            renderTasks();

        }


        taskInput.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter"
                ) {

                    addTask();

                }

            }
        );


        updateTimer();

        renderTasks();

    </script>

</body>
</html>
