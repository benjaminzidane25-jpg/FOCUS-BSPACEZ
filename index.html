<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFlow</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    color: white;
    transition: background 0.8s ease;
}

body.night {
    background:
        radial-gradient(circle at 50% 120%,
        #26345c 0%,
        #11172f 45%,
        #050817 100%);
}

body.day {
    background: linear-gradient(
        to bottom,
        #70c9ff 0%,
        #bdeaff 55%,
        #f8e6c2 100%
    );
}

/* ================= CLOUDS ================= */

.cloud {
    position: absolute;
    background: rgba(255,255,255,0.75);
    border-radius: 100px;
    width: 180px;
    height: 55px;
    filter: blur(1px);
    animation: cloudMove 45s linear infinite;
    z-index: 0;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 80px;
    height: 80px;
    left: 25px;
    bottom: 15px;
}

.cloud::after {
    width: 100px;
    height: 100px;
    right: 25px;
    bottom: 10px;
}

.cloud1 {
    top: 12%;
    left: -200px;
    animation-duration: 42s;
}

.cloud2 {
    top: 30%;
    left: -300px;
    transform: scale(0.7);
    animation-duration: 55s;
    animation-delay: -20s;
}

.cloud3 {
    top: 8%;
    left: -250px;
    transform: scale(0.5);
    animation-duration: 65s;
    animation-delay: -35s;
}

@keyframes cloudMove {
    from { left: -300px; }
    to { left: 110%; }
}

/* ================= STARS ================= */

.stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* ================= APP ================= */

.app {
    position: relative;
    z-index: 5;
    width: min(1100px, 92%);
    height: 90vh;
    margin: 5vh auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}

.tagline {
    opacity: 0.75;
    font-size: 13px;
    margin-top: 4px;
}

/* ================= BUTTONS ================= */

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.25s;
}

.control-btn {
    padding: 10px 15px;
    border-radius: 14px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
}

.control-btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.25);
}

.top-controls {
    display: flex;
    gap: 10px;
}

/* ================= CONTENT ================= */

.content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-items: center;
}

.glass {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
}

/* ================= TIMER ================= */

.timer-card {
    text-align: center;
}

.timer-label {
    font-size: 14px;
    opacity: 0.75;
    margin-bottom: 15px;
}

#timer {
    font-size: clamp(65px, 10vw, 110px);
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

.timer-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.timer-choice {
    padding: 9px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.12);
    color: white;
}

.timer-choice.active {
    background: rgba(255,255,255,0.35);
}

.main-timer-btn {
    padding: 13px 28px;
    border-radius: 15px;
    background: white;
    color: #222;
    font-size: 15px;
}

.main-timer-btn:hover {
    transform: scale(1.04);
}

/* ================= TASKS ================= */

.task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.task-header h2 {
    font-size: 21px;
}

.add-task {
    padding: 9px 13px;
    border-radius: 12px;
    background: rgba(255,255,255,0.18);
    color: white;
}

.add-task:hover {
    background: rgba(255,255,255,0.3);
}

#taskInput {
    width: 100%;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.15);
    color: white;
    display: none;
}

#taskInput::placeholder {
    color: rgba(255,255,255,0.65);
}

.task-list {
    list-style: none;
    max-height: 270px;
    overflow-y: auto;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
}

.task span {
    flex: 1;
    word-break: break-word;
}

.task.completed span {
    text-decoration: line-through;
    opacity: 0.5;
}

.delete-task {
    background: transparent;
    color: white;
    opacity: 0.5;
    font-size: 16px;
}

.delete-task:hover {
    opacity: 1;
}

/* ================= AMBIENCE PANEL ================= */

.ambience-panel {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 20;
    width: 240px;
    padding: 18px;
    border-radius: 20px;

    background: rgba(15,20,40,0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.15);

    display: none;
}

.ambience-panel.show {
    display: block;
}

.ambience-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 15px;
}

.sound-box {
    margin-bottom: 17px;
}

.sound-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.sound-name {
    font-size: 13px;
    opacity: 0.85;
}

.sound-button {
    padding: 7px 10px;
    border-radius: 10px;
    color: white;
    background: rgba(255,255,255,0.13);
}

.sound-button.playing {
    background: rgba(255,255,255,0.28);
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

/* ================= FOOTER ================= */

footer {
    text-align: center;
    font-size: 12px;
    opacity: 0.5;
}

/* ================= MOBILE ================= */

@media (max-width: 750px) {

    .app {
        height: 94vh;
        margin: 3vh auto;
    }

    .content {
        grid-template-columns: 1fr;
        gap: 15px;
        overflow-y: auto;
        padding: 5px;
    }

    .glass {
        padding: 22px;
    }

    #timer {
        font-size: 65px;
    }

    header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
}
</style>
</head>

<body class="night">

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="stars" id="stars"></div>

<div class="app">

    <header>

        <div>
            <div class="logo">FocusFlow</div>
            <div class="tagline">
                Focus better. Flow easier.
            </div>
        </div>

        <div class="top-controls">

            <button
                class="control-btn"
                onclick="toggleTheme()"
                id="themeBtn">
                ☀️ Day
            </button>

            <button
                class="control-btn"
                onclick="toggleAmbience()">
                🎧 Ambience
            </button>

        </div>

    </header>


    <div class="content">

        <!-- TIMER -->

        <div class="glass timer-card">

            <div class="timer-label">
                FOCUS SESSION
            </div>

            <div id="timer">
                25:00
            </div>

            <div class="timer-buttons">

                <button
                    class="timer-choice"
                    onclick="setTimer(15, this)">
                    15 min
                </button>

                <button
                    class="timer-choice active"
                    onclick="setTimer(25, this)">
                    25 min
                </button>

                <button
                    class="timer-choice"
                    onclick="setTimer(45, this)">
                    45 min
                </button>

                <button
                    class="timer-choice"
                    onclick="setTimer(60, this)">
                    60 min
                </button>

            </div>

            <button
                class="main-timer-btn"
                onclick="toggleTimer()"
                id="startBtn">
                Start Focus
            </button>

        </div>


        <!-- TASKS -->

        <div class="glass">

            <div class="task-header">

                <h2>My Tasks</h2>

                <button
                    class="add-task"
                    onclick="showTaskInput()">
                    + Add Task
                </button>

            </div>

            <input
                id="taskInput"
                type="text"
                placeholder="What do you need to do?"
                onkeydown="handleTaskInput(event)"
            >

            <ul
                class="task-list"
                id="taskList">
            </ul>

        </div>

    </div>


    <footer>
        Take a breath. Focus on one thing at a time.
    </footer>

</div>


<!-- AMBIENCE PANEL -->

<div
    class="ambience-panel"
    id="ambiencePanel">

    <div class="ambience-title">
        ✨ Focus Ambience
    </div>


    <!-- RAIN -->

    <div class="sound-box">

        <div class="sound-top">

            <span class="sound-name">
                🌧️ Rain
            </span>

            <button
                class="sound-button"
                id="rainButton"
                onclick="toggleRain()">
                ▶ Play
            </button>

        </div>

        <input
            id="rainVolume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.30"
            oninput="changeRainVolume(this.value)"
        >

    </div>


    <!-- PIANO -->

    <div class="sound-box">

        <div class="sound-top">

            <span class="sound-name">
                🎹 Soft Piano
            </span>

            <button
                class="sound-button"
                id="pianoButton"
                onclick="togglePiano()">
                ▶ Play
            </button>

        </div>

        <input
            id="pianoVolume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.18"
            oninput="changePianoVolume(this.value)"
        >

    </div>

</div>


<script>

/* =====================================================
   STARS
===================================================== */

const starsContainer =
    document.getElementById("stars");

for (let i = 0; i < 110; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    star.style.animationDuration =
        (1.5 + Math.random() * 2.5) + "s";

    const size =
        1 + Math.random() * 3;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    starsContainer.appendChild(star);
}


/* =====================================================
   THEME
===================================================== */

let currentTheme = "night";

function toggleTheme() {

    if (currentTheme === "night") {

        currentTheme = "day";

        document.body.classList.remove("night");
        document.body.classList.add("day");

        document.getElementById("themeBtn")
            .textContent = "🌙 Night";

    } else {

        currentTheme = "night";

        document.body.classList.remove("day");
        document.body.classList.add("night");

        document.getElementById("themeBtn")
            .textContent = "☀️ Day";
    }
}


/* =====================================================
   TIMER
===================================================== */

let selectedMinutes = 25;

let remainingSeconds =
    selectedMinutes * 60;

let timerInterval = null;

let timerRunning = false;


const timerDisplay =
    document.getElementById("timer");

const startBtn =
    document.getElementById("startBtn");


function updateTimerDisplay() {

    const minutes =
        Math.floor(remainingSeconds / 60);

    const seconds =
        remainingSeconds % 60;

    timerDisplay.textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(seconds).padStart(2, "0");
}


function setTimer(minutes, button) {

    clearInterval(timerInterval);

    timerRunning = false;

    selectedMinutes = minutes;

    remainingSeconds =
        minutes * 60;

    updateTimerDisplay();

    startBtn.textContent =
        "Start Focus";

    document
        .querySelectorAll(".timer-choice")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");
}


function toggleTimer() {

    if (timerRunning) {

        clearInterval(timerInterval);

        timerRunning = false;

        startBtn.textContent =
            "Resume";

        return;
    }


    timerRunning = true;

    startBtn.textContent =
        "Pause";


    timerInterval =
        setInterval(() => {

            if (remainingSeconds > 0) {

                remainingSeconds--;

                updateTimerDisplay();

            } else {

                clearInterval(timerInterval);

                timerRunning = false;

                startBtn.textContent =
                    "Start Focus";

                alert(
                    "✨ Focus session complete! Great job."
                );
            }

        }, 1000);
}


/* =====================================================
   TASKS
===================================================== */

const taskInput =
    document.getElementById("taskInput");

const taskList =
    document.getElementById("taskList");


function showTaskInput() {

    taskInput.style.display =
        "block";

    taskInput.focus();
}


function handleTaskInput(event) {

    if (event.key === "Enter") {

        const text =
            taskInput.value.trim();

        if (text !== "") {

            addTask(text);

            taskInput.value = "";

            taskInput.style.display =
                "none";
        }
    }


    if (event.key === "Escape") {

        taskInput.value = "";

        taskInput.style.display =
            "none";
    }
}


function addTask(text) {

    const li =
        document.createElement("li");

    li.className = "task";


    const checkbox =
        document.createElement("input");

    checkbox.type = "checkbox";


    const span =
        document.createElement("span");

    span.textContent = text;


    const deleteButton =
        document.createElement("button");

    deleteButton.className =
        "delete-task";

    deleteButton.textContent =
        "✕";


    checkbox.addEventListener(
        "change",
        () => {

            li.classList.toggle(
                "completed",
                checkbox.checked
            );

        }
    );


    deleteButton.addEventListener(
        "click",
        () => {

            li.remove();

        }
    );


    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(deleteButton);

    taskList.appendChild(li);
}


/* =====================================================
   AMBIENCE PANEL
===================================================== */

function toggleAmbience() {

    document
        .getElementById("ambiencePanel")
        .classList.toggle("show");
}


/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioContext = null;


/* =====================================================
   RAIN
===================================================== */

let rainSource = null;
let rainGain = null;
let rainFilter = null;
let rainPlaying = false;


function setupAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (audioContext.state === "suspended") {

        audioContext.resume();
    }
}


function createRain() {

    setupAudio();


    const bufferSize =
        audioContext.sampleRate * 2;


    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    /*
       White noise
       → filtered
       → softer rain-like sound
    */

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;
    }


    rainSource =
        audioContext.createBufferSource();

    rainSource.buffer =
        buffer;

    rainSource.loop =
        true;


    rainFilter =
        audioContext.createBiquadFilter();

    rainFilter.type =
        "lowpass";

    rainFilter.frequency.value =
        5000;


    rainGain =
        audioContext.createGain();

    rainGain.gain.value =
        Number(
            document.getElementById(
                "rainVolume"
            ).value
        );


    rainSource
        .connect(rainFilter)
        .connect(rainGain)
        .connect(
            audioContext.destination
        );


    rainSource.start();

    rainPlaying = true;

    document.getElementById(
        "rainButton"
    ).textContent = "⏸ Stop";

    document.getElementById(
        "rainButton"
    ).classList.add("playing");
}


function toggleRain() {

    if (!rainSource) {

        createRain();

        return;
    }


    if (rainPlaying) {

        rainGain.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            0.08
        );

        rainPlaying = false;

        document.getElementById(
            "rainButton"
        ).textContent = "▶ Play";

        document.getElementById(
            "rainButton"
        ).classList.remove("playing");

    } else {

        setupAudio();

        rainGain.gain.setTargetAtTime(
            Number(
                document.getElementById(
                    "rainVolume"
                ).value
            ),
            audioContext.currentTime,
            0.08
        );

        rainPlaying = true;

        document.getElementById(
            "rainButton"
        ).textContent = "⏸ Stop";

        document.getElementById(
            "rainButton"
        ).classList.add("playing");
    }
}


function changeRainVolume(value) {

    if (!rainGain) return;

    if (rainPlaying) {

        rainGain.gain.setTargetAtTime(
            Number(value),
            audioContext.currentTime,
            0.05
        );
    }
}


/* =====================================================
   PIANO
===================================================== */

let pianoPlaying = false;
let pianoTimer = null;
let pianoGain = null;


/*
   Piano-like notes.

   These are frequencies of a simple
   C major / dreamy progression.
*/

const pianoNotes = [
    261.63, 329.63, 392.00,
    293.66, 349.23, 440.00,
    261.63, 329.63, 392.00,
    246.94, 329.63, 392.00
];


let pianoIndex = 0;


function createPianoMaster() {

    setupAudio();

    pianoGain =
        audioContext.createGain();

    pianoGain.gain.value =
        Number(
            document.getElementById(
                "pianoVolume"
            ).value
        );

    pianoGain.connect(
        audioContext.destination
    );
}


function playPianoNote(frequency) {

    if (!audioContext ||
        !pianoGain ||
        !pianoPlaying) return;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    /*
       Triangle wave gives a softer,
       less synthetic piano-ish tone.
    */

    oscillator.type =
        "triangle";

    oscillator.frequency.value =
        frequency;


    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        0.32,
        now + 0.04
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 2.4
    );


    oscillator.connect(gain);
    gain.connect(pianoGain);


    oscillator.start(now);

    oscillator.stop(
        now + 2.5
    );
}


function pianoLoop() {

    if (!pianoPlaying) return;


    playPianoNote(
        pianoNotes[pianoIndex]
    );


    pianoIndex =
        (pianoIndex + 1)
        % pianoNotes.length;


    /*
       Slow spacing between notes
       so the piano stays ambient.
    */

    pianoTimer =
        setTimeout(
            pianoLoop,
            900
        );
}


function togglePiano() {

    if (!pianoPlaying) {

        setupAudio();

        createPianoMaster();

        pianoPlaying = true;

        pianoIndex = 0;

        pianoLoop();


        document.getElementById(
            "pianoButton"
        ).textContent = "⏸ Stop";

        document.getElementById(
            "pianoButton"
        ).classList.add("playing");

    } else {

        pianoPlaying = false;

        clearTimeout(pianoTimer);

        document.getElementById(
            "pianoButton"
        ).textContent = "▶ Play";

        document.getElementById(
            "pianoButton"
        ).classList.remove("playing");
    }
}


function changePianoVolume(value) {

    if (!pianoGain) return;

    pianoGain.gain.setTargetAtTime(
        Number(value),
        audioContext.currentTime,
        0.05
    );
}


/* =====================================================
   INITIALIZE
===================================================== */

updateTimerDisplay();

</script>

</body>
</html>
